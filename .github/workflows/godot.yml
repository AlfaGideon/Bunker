name: Godot checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.5.1'
          use-dotnet: false
          include-templates: false
      - name: Import and compile project
        run: |
          bash tools/check_godot.sh --headless --editor --path . --quit
      - name: Render exit tunnel bend
        run: GODOT_TIMEOUT=90 timeout 120 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_exit_entrance.gd -- bend
      - name: Render full bot lobby
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_welcome.gd -- --lobby
      - name: Render visual preview
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd
      - name: Check vote rules
        run: |
          bash tools/check_godot.sh --headless --path . --script tools/test_profile.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_parameter_library.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_reroll.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_rules.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_timed_voting.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_weather.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_medical_doctor.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_navigation.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_room.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_station_motion.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_annexes.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_exit_tunnel.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_rig.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_game_flow.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_iteration4.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_iteration5.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_iteration6.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_iteration7.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_camera_gestures.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_first_person.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_online_match_state.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_online_session.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_online_scene.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_first_person_gestures.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_welcome.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_lobby_ui.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_negative_actions.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_avatar_skins.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_app_updates.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_update_network.gd
          GODOT_TIMEOUT=240 bash tools/check_godot.sh --headless --path . --script tools/test_update_download.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_card_menus.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_character_card.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_library_gallery.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_table_card.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_radio.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_internet_radio.gd
          bash tools/check_godot.sh --headless --path . --script tools/test_radio_speech.gd
          python3 tools/test_release_config.py
      - name: Smoke test scene
        run: |
          godot --headless --path . --quit-after 120 2>&1 | tee /tmp/scene.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/scene.log
      - name: Render first-person view
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_first_person.gd
      - name: Render hall-side entrance
        run: GODOT_TIMEOUT=90 timeout 120 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_exit_entrance.gd -- front
      - name: Render hall-side entrance from the side
        run: GODOT_TIMEOUT=90 timeout 120 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_exit_entrance.gd -- angle
      - name: Render first-person exit tunnel
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_exit_view.gd
      - name: Render menu preview
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_welcome.gd
      - name: Keep the menu preview as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: menu-preview
          path: builds/scene.jpg
          if-no-files-found: error
      - name: Render updated update screen
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_welcome.gd -- --update
      - name: Render wide phone aspect ratio
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a -s "-screen 0 2560x1440x24" bash tools/check_godot.sh --windowed --resolution 2460x1080 --path . --script tools/capture_scene.gd -- --wide
      - name: Render survival panel
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --survival
      - name: Render camp radio
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_welcome.gd -- --camp-radio
  visual-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.5.1'
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: bash tools/check_godot.sh --headless --editor --path . --quit
      - name: Render flood and mirrored layout
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --flood
      - name: Render meteor catastrophe
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --meteors
      - name: Render infection exterior
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --infection
      - name: Render unlocked medical room
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --open-med
      - name: Render actual bed interaction
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --sleep
  visual-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.5.1'
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: bash tools/check_godot.sh --headless --editor --path . --quit
      - name: Render new character close-up
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --characters
      - name: Render burning meteor close-up
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --meteor-detail
      - name: Render infected close-up
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --infection-detail
      - name: Render solar storm
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --solar
      - name: Render timed vote
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --vote
      - name: Render council decision
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --council
      - name: Render kitchen and shared food
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --facilities
  visual-stations:
    # Its own job so the close-up of the interaction stations keeps a fresh
    # annotation budget: Actions caps notices per job, and the shared visual
    # jobs already spend theirs on seven other shots.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.5.1'
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: bash tools/check_godot.sh --headless --editor --path . --quit
      - name: Render the Blender interaction stations
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --stations

  visual-character-card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: checks
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.5.1'
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: bash tools/check_godot.sh --headless --editor --path . --quit
      - name: Render face-up character card
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --card-front
      - name: Render profession card back
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --card-back
      - name: Render owner's private card
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --card-own
      - name: Render in-game table card and turn panel
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --hud
      - name: Render table card parameters
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --hud-front
      - name: Render radio receiver
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --radio

  visual-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.5.1'
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: bash tools/check_godot.sh --headless --editor --path . --quit
      - name: Render modular building seed 0
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --architecture
      - name: Render modular building seed 17
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --architecture-alt
      - name: Inspect welcome profile card layout
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_welcome.gd -- --profile
      - name: Render parameter library
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_welcome.gd -- --library
      - name: Render library editing
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_welcome.gd -- --library-form
      - name: Render profession catalogue in the library
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_welcome.gd -- --library-professions
      - name: Inspect touch settings card layout
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_welcome.gd -- --settings
      - name: Render welcome appearance preview
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_welcome.gd -- --female
      - name: Render harmful-action menu with matching flaw
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_scene.gd -- --negative-actions
      - name: Render running preparation screen
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_loading.gd

  visual-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.5.1'
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: bash tools/check_godot.sh --headless --editor --path . --quit
      - name: Render departure
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_loading.gd -- --start
      - name: Render journey
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_loading.gd
      - name: Render arrival
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_loading.gd -- --arrival

  visual-skins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.5.1'
          use-dotnet: false
          include-templates: false
      - name: Import project
        run: bash tools/check_godot.sh --headless --editor --path . --quit
      - name: Young man
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_welcome.gd -- --skin=male_young
      - name: Young woman
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_welcome.gd -- --skin=female_young
      - name: Senior man
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_welcome.gd -- --skin=male_senior
      - name: Senior woman
        run: GODOT_TIMEOUT=60 timeout 90 xvfb-run -a bash tools/check_godot.sh --windowed --resolution 1280x720 --path . --script tools/capture_welcome.gd -- --skin=female_senior

  online-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.5.1'
          use-dotnet: false
          include-templates: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r server/requirements.txt
      - run: bash tools/check_godot.sh --headless --editor --path . --quit
      - name: Two actual game scenes over HTTP polling
        run: |
          python server/app.py > /tmp/online-server.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          sleep 2
          GODOT_TIMEOUT=180 bash tools/check_godot.sh --headless --path . --script tools/check_live_online.gd
          GODOT_TIMEOUT=180 bash tools/check_godot.sh --headless --path . --script tools/check_live_entry.gd
