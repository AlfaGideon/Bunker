name: Godot checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.5.1'
          use-dotnet: false
          include-templates: false
      - name: Import and compile project
        run: |
          godot --headless --editor --path . --quit 2>&1 | tee /tmp/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/import.log
      - name: Check vote rules
        run: |
          godot --headless --path . --script tools/test_rules.gd
          godot --headless --path . --script tools/test_navigation.gd
          godot --headless --path . --script tools/test_room.gd
      - name: Smoke test scene
        run: |
          godot --headless --path . --quit-after 120 2>&1 | tee /tmp/scene.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load script' /tmp/scene.log
      - name: Render visual preview
        run: timeout 90 xvfb-run -a godot --path . --script tools/capture_scene.gd
