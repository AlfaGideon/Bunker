name: Blender asset kit
on:
  push:
    branches: [arena/a25f55da-bunker, arena/1e6def97-bunker, arena/0afa9ec8-bunker, arena/9f4b996e-bunker, arena/60f63d97-bunker, arena/0197b55f-bunker, arena/e42c8910-bunker, arena/8738ff37-bunker]
    paths:
      - 'tools/blender/**'
      - '.github/workflows/blender-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the Blender Python module
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxi6 libsm6 libice6 libxfixes3 \
            libxxf86vm1 libxkbcommon0 libgl1 libegl1
          pip install --quiet 'bpy==4.2.0'
      - name: Check the module
        run: python -c "import bpy; print('Blender', bpy.app.version_string)"
      - name: Rebuild every prop
        run: |
          # bpy can abort while tearing down its interpreter even after a
          # successful export, so the artefacts are what gets checked below.
          python tools/blender/build.py --out builds/blender --preview builds/blender-preview > /tmp/blender.log 2>&1 || true
          tail -n 15 /tmp/blender.log
      - name: Verify the rebuilt props
        run: |
          set -euo pipefail
          for name in campfire crate radio radio_station food_station medkit terminal \
                       bed toilet operating_table pantry_shelf boulder chair plasma_tv; do
            built="builds/blender/$name.glb"
            committed="assets/blender/$name.glb"
            test -f "$built" || { echo "::error::$name was not built"; exit 1; }
            test -f "$committed"
            built_size=$(stat -c%s "$built")
            committed_size=$(stat -c%s "$committed")
            echo "$name: built $built_size bytes, committed $committed_size bytes"
            test "$built_size" -gt 8000
            if [ "$((built_size / 40))" -ne "$((committed_size / 40))" ]; then
              echo "::warning title=$name::The committed $name.glb differs from a fresh build; run tools/blender/build.py and commit the result."
            fi
            test -f "builds/blender-preview/blender-$name.png" || { echo "::error::$name preview was not rendered"; exit 1; }
          done
      - name: Keep the previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blender-previews
          path: builds/blender-preview
          if-no-files-found: error
