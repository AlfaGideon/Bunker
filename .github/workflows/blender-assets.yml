name: Blender asset kit
on:
  push:
    branches: [arena/a25f55da-bunker, arena/1e6def97-bunker, arena/0afa9ec8-bunker, arena/9f4b996e-bunker, arena/60f63d97-bunker, arena/0197b55f-bunker, arena/e42c8910-bunker, arena/8738ff37-bunker]
    paths:
      - 'tools/blender/**'
      - '.github/workflows/blender-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the Blender Python module
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxi6 libsm6 libice6 libxfixes3 \
            libxxf86vm1 libxkbcommon0 libgl1 libegl1
          pip install --quiet 'bpy==4.2.0'
      - name: Check the module
        run: python -c "import bpy; print('Blender', bpy.app.version_string)"
      - name: Rebuild every prop
        run: |
          set -o pipefail
          python tools/blender/build.py --out builds/blender --preview builds/blender-preview > /tmp/blender.log 2>&1 || {
            python -c "from pathlib import Path;print('::error::'+Path('/tmp/blender.log').read_text(errors='replace')[-3500:].replace('%','%25').replace(chr(10),'%0A'))"
            exit 1
          }
          tail -n 20 /tmp/blender.log
      - name: Compare with the committed assets
        run: |
          set -euo pipefail
          for name in campfire crate radio; do
            test -f "assets/blender/$name.glb"
            built=$(stat -c%s "builds/blender/$name.glb")
            committed=$(stat -c%s "assets/blender/$name.glb")
            echo "$name: built $built bytes, committed $committed bytes"
            # glTF packing is deterministic enough that a drift means the
            # committed asset was not regenerated from these scripts.
            test "$built" -gt 20000
            test "$(($(stat -c%s "builds/blender/$name.glb") / 20))" -eq "$(($committed / 20))" || {
              echo "::warning title=$name::The committed $name.glb differs from a fresh build. Run tools/blender/build.py and commit the result."
            }
          done
      - name: Keep the previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blender-previews
          path: builds/blender-preview
          if-no-files-found: error
