name: Defold build
on:
  workflow_dispatch:
  push:
    branches: [arena/8738ff37-bunker]
    paths:
      - 'defold/**'
      - 'tools/export_defold_data.py'
      - 'tools/check_defold_files.py'
      - 'tools/test_defold_gui.py'
      - 'tools/gen_camp_gui.py'
      - 'tools/preview_defold_layout.py'
      - 'tools/make_defold_card_back.py'
      - '.github/workflows/defold-build.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      RELEASE: defold-2
      APK_NAME: Bunker-Defold-2.apk
      RELEASE_TITLE: Бункер — Defold-сборка 2 (экспериментальная)
      BOB_VERSION: '1.14.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          # bob.jar 1.14 is compiled for Java 25 (class file version 69).
          distribution: temurin
          java-version: '25'
      - name: Check the exported content
        run: python3 tools/export_defold_data.py --check
      - name: Check the generated layout
        run: python3 tools/gen_camp_gui.py --check
      - name: Check the Defold resources
        run: |
          python3 -m pip install --quiet grpcio-tools
          python3 tools/check_defold_files.py
      - name: Smoke-test the camp script
        run: |
          set -uo pipefail
          python3 -m pip install --quiet lupa || echo "::warning title=lupa::pip install lupa failed"
          if python3 -c 'import lupa' 2>/dev/null; then
            if ! out=$(python3 tools/test_defold_gui.py 2>&1); then
              printf '%s\n' "$out"
              # step logs are not retrievable from the sandbox, annotations are
              printf '%s\n' "$out" | tail -8 | while IFS= read -r line; do
                echo "::error title=lupa-test::$line"
              done
              exit 1
            fi
            printf '%s\n' "$out"
          else
            echo "::warning title=lupa::lupa is not installable on this runner, the headless script test is skipped"
          fi
      - name: Fetch bob
        run: |
          set -uo pipefail
          url="https://github.com/defold/defold/releases/download/${BOB_VERSION}/bob.jar"
          if ! curl -fL --retry 3 -o "$RUNNER_TEMP/bob.jar" "$url"; then
            echo "::error title=bob.jar::GitHub asset $url could not be downloaded"
            exit 1
          fi
          ls -l "$RUNNER_TEMP/bob.jar"
      - name: Restore the signing key
        env:
          KEY: ${{ secrets.BUNKER_KEYSTORE_BASE64 }}
          PASS: ${{ secrets.BUNKER_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.BUNKER_KEY_ALIAS }}
        run: |
          set -uo pipefail
          if [ -n "$KEY" ] && [ -n "$PASS" ] && [ -n "$ALIAS" ]; then
            printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/bunker.keystore"
            # bob takes the passwords as paths to files, not as strings.
            printf '%s' "$PASS" > "$RUNNER_TEMP/keystore.pass"
            printf '%s' "$PASS" > "$RUNNER_TEMP/key.pass"
            echo "SIGNING=1" >> "$GITHUB_ENV"
            echo "keystore ready for alias $ALIAS"
          else
            echo "SIGNING=0" >> "$GITHUB_ENV"
            echo "no keystore: bob will generate a debug keystore"
          fi
      - name: Bundle the APK
        env:
          KEY_ALIAS: ${{ secrets.BUNKER_KEY_ALIAS }}
        run: |
          set -uo pipefail
          cd defold
          bundle() {
            local extra=("$@")
            java -jar "$RUNNER_TEMP/bob.jar" \
              --platform armv7-android \
              --architectures arm64-android,armv7-android \
              --archive \
              --bundle-output "$RUNNER_TEMP/bundle" \
              "${extra[@]}" \
              resolve build bundle
          }
          signed=(--variant release --keystore "$RUNNER_TEMP/bunker.keystore"
                  --keystore-pass "$RUNNER_TEMP/keystore.pass"
                  --key-pass "$RUNNER_TEMP/key.pass"
                  --keystore-alias "$KEY_ALIAS")
          if [ "${SIGNING:-0}" = "1" ] && bundle "${signed[@]}" > /tmp/bundle-release.log 2>&1; then
            echo "release APK bundled and signed with the project key"
          else
            echo "::warning::Release bundling did not finish; falling back to a debug build."
            grep -aE "ERROR|Exception|error:" /tmp/bundle-release.log | tail -10 || true
            bundle --variant debug > /tmp/bundle-release.log 2>&1 || true
          fi
          tail -n 5 /tmp/bundle-release.log
          {
            echo "### Defold bundle"
            echo '```'
            tail -n 25 /tmp/bundle-release.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          find "$RUNNER_TEMP/bundle" -name '*.apk' -printf '%p %s bytes\n'
      - name: Verify the APK
        run: |
          set -uo pipefail
          apk=$(find "$RUNNER_TEMP/bundle" -name '*.apk' | head -1)
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt=$(ls "$sdk"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          signer=$(ls "$sdk"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          mkdir -p dist
          : > dist/verify.txt
          if [ -n "$aapt" ]; then
            "$aapt" dump badging "$apk" 2>&1 | head -3 >> dist/verify.txt
          else
            echo "aapt2 not found in $sdk" >> dist/verify.txt
          fi
          if [ -n "$signer" ]; then
            "$signer" verify --print-certs "$apk" 2>&1 | grep -E "Signer|SHA-256|DN" >> dist/verify.txt || true
          else
            echo "apksigner not found in $sdk" >> dist/verify.txt
          fi
          cp "$apk" "dist/$APK_NAME"
          cat dist/verify.txt
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          exec > >(tee /tmp/publish.log) 2>&1
          set -euo pipefail
          apk="dist/$APK_NAME"
          [ -f "$apk" ] || { echo "::error::no APK to publish"; exit 1; }
          sha256sum dist/*.apk > dist/SHA256SUMS
          notes="Отдельная сборка на движке Defold, пакет org.bunker.defold: ставится рядом с основной игрой. Блок 1 порта — лагерь, плазменная панель с заставкой логотипа, аниме-канал, рекламный блок и карточка профессии из общего data/content.json. Сборка 2 исправляет то, из-за чего первая сборка выглядела статичной картинкой: экран загрузки с логотипом, ответ на касания (счётчик тапов в нижней строке), правильная раскладка узлов (панель, подпись и карточка на своих местах, без обрезки за краем экрана)."
          if [ -f dist/verify.txt ]; then
            notes=$(printf '%s\n\n```\n%s\n```\n' "$notes" "$(cat dist/verify.txt)")
          fi
          if ! gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release create "$RELEASE" \
              --title "$RELEASE_TITLE" \
              --notes "$notes" --prerelease
          fi
          gh release edit "$RELEASE" --notes "$notes"
          for asset in "dist/$APK_NAME" dist/SHA256SUMS; do
            gh release upload "$RELEASE" "$asset" --clobber \
              || echo "::warning title=upload::$asset did not upload"
          done
          gh release view "$RELEASE" --json assets -q '.assets[] | "\(.name) \(.size)"'
          names=$(gh release view "$RELEASE" --json assets -q '.assets[].name')
          if ! echo "$names" | grep -qF "$APK_NAME"; then
            echo "::error::the release carries no APK"
            exit 1
          fi
      - name: Keep the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: defold-apk
          path: |
            dist/*.apk
            dist/verify.txt
