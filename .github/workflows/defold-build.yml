name: Defold build
on:
  workflow_dispatch:
  push:
    branches: [arena/8738ff37-bunker]
    paths:
      - 'defold/**'
      - 'tools/export_defold_data.py'
      - '.github/workflows/defold-build.yml'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      RELEASE: defold-1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check the exported content
        run: python3 tools/export_defold_data.py --check
      - name: Fetch bob
        env:
          BOB_VERSION: '1.14.0'
        run: |
          set -uo pipefail
          url="https://github.com/defold/defold/releases/download/${BOB_VERSION}/bob.jar"
          if ! curl -fL --retry 3 -o "$RUNNER_TEMP/bob.jar" "$url"; then
            echo "::error title=bob.jar::GitHub asset $url could not be downloaded"
            exit 1
          fi
          ls -l "$RUNNER_TEMP/bob.jar"
          java -version > /tmp/java-version.txt 2>&1 || true
          while IFS= read -r line; do echo "::notice title=java::$line"; done < /tmp/java-version.txt
          java -jar "$RUNNER_TEMP/bob.jar" --version > /tmp/bob-version.txt 2>&1 || true
          head -20 /tmp/bob-version.txt > /tmp/bob-version-head.txt || true
          while IFS= read -r line; do echo "::notice title=bob::$line"; done < /tmp/bob-version-head.txt
      - name: Restore the signing key
        env:
          KEY: ${{ secrets.BUNKER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY" ]; then
            printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/bunker.keystore"
            echo "keystore ready"
          else
            echo "no keystore: the build will be debug-signed"
          fi
      - name: Bundle the APK
        env:
          KEYSTORE_PASS: ${{ secrets.BUNKER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUNKER_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cd defold
          bundle() {
            java -jar "$RUNNER_TEMP/bob.jar" \
              --platform armv7-android \
              --architectures arm64-android,armv7-android \
              --variant "$1" \
              --bundle-output build/bob \
              --keystore "$RUNNER_TEMP/bunker.keystore" \
              --keystore-pass "$KEYSTORE_PASS" \
              --keystore-alias "$KEY_ALIAS" \
              resolve build bundle
          }
          if ! bundle release 2>&1 | tee /tmp/bundle-release.log; then
            echo "::warning::Release bundling failed, falling back to a debug build."
            tail -c 2500 /tmp/bundle-release.log | while IFS= read -r line; do
              echo "::error title=release bundle::$line"
            done
            java -jar "$RUNNER_TEMP/bob.jar" \
              --platform armv7-android \
              --architectures arm64-android,armv7-android \
              --variant debug \
              --bundle-output build/bob \
              resolve build bundle
          fi
          find build -name '*.apk' -printf '%p %s bytes\n'
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apk=$(find defold/build -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo "::error::bob produced no APK"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/Bunker-Defold-1.apk"
          cp "$apk" "dist/bunker-defold-1.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS
          if ! gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release create "$RELEASE" \
              --title "Бункер — Defold-сборка 1 (экспериментальная)" \
              --notes "Отдельная сборка на движке Defold, пакет org.bunker.defold. Ставится рядом с основной игрой. Блок 1 порта: лагерь, плазменная панель с заставкой логотипа, аниме-канал и рекламный блок, карточка профессии из общего data/content.json." \
              --prerelease
          fi
          gh release upload "$RELEASE" dist/Bunker-Defold-1.apk dist/bunker-defold-1.apk dist/SHA256SUMS --clobber
      - name: Keep the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: defold-apk
          path: dist/*.apk
