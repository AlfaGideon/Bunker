name: Live lobby smoke test
on:
  push:
    paths:
      - '.github/workflows/live-lobby-test.yml'
      - 'tools/test_live_lobby.py'
  workflow_dispatch:
    inputs:
      lobby_url:
        description: 'Public lobby HTTPS URL'
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r server/requirements.txt
      - run: python tools/test_live_lobby.py
        env:
          LOBBY_URL: ${{ inputs.lobby_url || 'https://bunker-154de.containers.snapdeploy.app' }}
