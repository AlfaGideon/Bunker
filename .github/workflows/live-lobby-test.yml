name: Live lobby HTTPS smoke test
on:
  push:
    paths:
      - '.github/workflows/live-lobby-test.yml'
      - 'tools/test_live_lobby.py'
      - 'tools/test_live_http_lobby.py'
  workflow_dispatch:
    inputs:
      lobby_url:
        description: 'Public lobby HTTPS URL'
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r server/requirements.txt
      - name: HTTPS polling transport
        run: |
          python tools/test_live_http_lobby.py > /tmp/poll-test.log 2>&1 || {
            python -c 'from pathlib import Path; print("::error::" + Path("/tmp/poll-test.log").read_text()[-7000:].replace("%", "%25").replace("\n", "%0A"))'
            exit 1
          }
          cat /tmp/poll-test.log
        env:
          LOBBY_URL: ${{ inputs.lobby_url || 'https://alfagideon.blitz.cloud' }}
      - name: WebSocket transport (reported, the client falls back automatically)
        continue-on-error: true
        run: |
          python tools/test_live_lobby.py > /tmp/ws-test.log 2>&1 || {
            tail -n 20 /tmp/ws-test.log
            echo '::warning title=WebSocket::The host refuses WebSocket; the client plays the same protocol over HTTPS polling.'
            exit 1
          }
          cat /tmp/ws-test.log
          echo 'WebSocket transport works on this host' >> "$GITHUB_STEP_SUMMARY"
        env:
          LOBBY_URL: ${{ inputs.lobby_url || 'https://alfagideon.blitz.cloud' }}
