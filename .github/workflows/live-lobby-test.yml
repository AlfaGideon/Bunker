name: Live lobby HTTPS smoke test
on:
  push:
    paths:
      - '.github/workflows/live-lobby-test.yml'
      - 'tools/test_live_lobby.py'
      - 'tools/test_live_http_lobby.py'
  workflow_dispatch:
    inputs:
      lobby_url:
        description: 'Public lobby HTTPS URL'
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r server/requirements.txt
      - run: |
          python tools/test_live_http_lobby.py > /tmp/snap-test.log 2>&1 || {
            python -c 'from pathlib import Path; print("::error::" + Path("/tmp/snap-test.log").read_text()[-7000:].replace("%", "%25").replace("\n", "%0A"))'
            exit 1
          }
          cat /tmp/snap-test.log
        env:
          LOBBY_URL: ${{ inputs.lobby_url || 'https://bunker-154de.containers.snapdeploy.app' }}
