name: Diagnose Unity build log
on:
  push:
    branches: [arena/574beb82-bunker]
    paths: [.github/workflows/unity-log-diagnosis.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read last Unity editor log from prior failed job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh api --allow-escape-sequences /repos/$GH_REPO/actions/jobs/124835570978/logs > /tmp/unity.log 2>/tmp/gh-error; then
            echo "::error::$(cat /tmp/gh-error)"
            exit 1
          fi
          python3 - <<'PY'
          import re
          text=open('/tmp/unity.log',errors='replace').read().splitlines()
          start=next((i for i,line in enumerate(text) if 'Unity Editor version:' in line),-1)
          section=text[start:] if start >= 0 else []
          excerpt='\n'.join(section[:100])
          excerpt=re.sub(r'\x1b\[[0-9;]*[a-zA-Z]', '', excerpt)
          print('::notice::'+excerpt.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          relevant=section
          print('::notice::Filtered diagnostic lines: '+str(len(relevant)))
          PY
