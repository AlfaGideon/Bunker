name: Unity protocol source checks
on:
  push:
    paths:
      - 'unity/**'
      - 'server/**'
      - '.github/workflows/unity-protocol.yml'
  pull_request:
    paths:
      - 'unity/**'
      - 'server/**'
      - '.github/workflows/unity-protocol.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r server/requirements.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile Unity client against test stubs and test existing server protocol
        run: |
          python server/app.py > /tmp/bunker-unity-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          dotnet run --project unity/ProtocolTests/ProtocolTests.csproj
      - name: Compile Android-specific C# against test stubs
        run: dotnet build unity/ProtocolTests/ProtocolTests.csproj -p:DefineConstants=UNITY_ANDROID
      - name: Check Android Java source against installed Android SDK
        run: |
          android_jar=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)
          test -n "$android_jar"
          mkdir -p /tmp/bunker-java
          javac -source 8 -target 8 -cp "$android_jar" -d /tmp/bunker-java unity/BunkerUnity/Assets/Plugins/Android/src/org/bunker/unityprototype/RadioSpeech.java
