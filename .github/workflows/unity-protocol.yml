name: Unity protocol source checks
on:
  push:
    paths:
      - 'unity/**'
      - 'server/**'
      - '.github/workflows/unity-protocol.yml'
  pull_request:
    paths:
      - 'unity/**'
      - 'server/**'
      - '.github/workflows/unity-protocol.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r server/requirements.txt
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile Unity client against test stubs and test existing server protocol
        run: |
          python server/app.py > /tmp/bunker-unity-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          dotnet run --project unity/ProtocolTests/ProtocolTests.csproj
