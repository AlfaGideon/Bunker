name: Publish signed Android update
on:
  workflow_dispatch:
  push:
    branches: [arena/d3ec098c-bunker]
    paths:
      - 'game/**'
      - 'data/**'
      - 'assets/**'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-release.yml'
permissions:
  contents: write
jobs:
  signing-ready:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.ready.outputs.configured }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: ready
        env:
          KEY: ${{ secrets.BUNKER_KEYSTORE_BASE64 }}
          PASS: ${{ secrets.BUNKER_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.BUNKER_KEY_ALIAS }}
        run: |
          requested=$(python3 -c 'import json; print(json.load(open("data/release-request.json"))["version_code"])')
          code=$(python3 -c 'import configparser; c=configparser.ConfigParser(interpolation=None); c.read("export_presets.cfg"); print(c.getint("preset.0.options", "version/code"))')
          if [ -n "$KEY" ] && [ -n "$PASS" ] && [ -n "$ALIAS" ] && [ "$requested" = "$code" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Signing secrets or version publication request are not ready; no public update will be published.'
          fi
  release:
    needs: signing-ready
    if: needs.signing-ready.outputs.configured == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.5.1'
          use-dotnet: false
          include-templates: true
      - name: Configure permanent signing (fail closed if missing)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          BUNKER_KEYSTORE_BASE64: ${{ secrets.BUNKER_KEYSTORE_BASE64 }}
          BUNKER_KEYSTORE_PASSWORD: ${{ secrets.BUNKER_KEYSTORE_PASSWORD }}
          BUNKER_KEY_ALIAS: ${{ secrets.BUNKER_KEY_ALIAS }}
          BUNKER_RELEASE: '1'
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          mkdir -p builds
          python3 tools/configure_android_signing.py
      - name: Validate immutable update version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/test_release_config.py
          code=$(python3 -c 'import configparser; c=configparser.ConfigParser(interpolation=None); c.read("export_presets.cfg"); print(c.getint("preset.0.options", "version/code"))')
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          if gh release view "android-$code" >/dev/null 2>&1; then
            echo '::error::This version code already has a release. Increase version/code and app_updates.VERSION_CODE.'
            exit 1
          fi
      - name: Import and test
        run: |
          bash tools/check_godot.sh --headless --editor --path . --quit
          for script in tools/test_*.gd; do
            bash tools/check_godot.sh --headless --path . --script "$script"
          done
      - name: Export and verify release APK
        run: |
          set -euo pipefail
          godot --headless --editor --path . --export-release Android "builds/bunker-$VERSION_CODE.apk" > /tmp/release-export.log 2>&1 || { echo '::error::Release export failed; inspect runner log without sharing secrets.'; exit 1; }
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose --print-certs "builds/bunker-$VERSION_CODE.apk"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "builds/bunker-$VERSION_CODE.apk" > /tmp/apk-badging.txt
          grep "^package: name='org.bunker.prototype' versionCode='$VERSION_CODE'" /tmp/apk-badging.txt
          cd builds
          cp "bunker-$VERSION_CODE.apk" "Bunker-Posledniy-Shlyuz-$VERSION_CODE.apk"
          sha256sum "bunker-$VERSION_CODE.apk" "Bunker-Posledniy-Shlyuz-$VERSION_CODE.apk" > SHA256SUMS
      - name: Verify upgrade signing compatibility with published version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null); then
            if [[ "$previous" =~ ^android-([0-9]+)$ ]]; then
              previous_code="${BASH_REMATCH[1]}"
              test "$VERSION_CODE" -gt "$previous_code"
              mkdir -p /tmp/previous-bunker
              gh release download "$previous" --pattern "bunker-$previous_code.apk" --dir /tmp/previous-bunker
              signer="$ANDROID_HOME/build-tools/35.0.1/apksigner"
              old=$($signer verify --print-certs "/tmp/previous-bunker/bunker-$previous_code.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
              new=$($signer verify --print-certs "builds/bunker-$VERSION_CODE.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
              test -n "$old" && test "$old" = "$new" || { echo '::error::Signing certificate changed; in-place updates would fail.'; exit 1; }
              echo "::notice::Signing certificate matches published Android $previous_code; package ID is unchanged."
            fi
          fi
      - name: Publish complete public update (no private key artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "android-$VERSION_CODE" "builds/bunker-$VERSION_CODE.apk" "builds/Bunker-Posledniy-Shlyuz-$VERSION_CODE.apk" builds/SHA256SUMS --draft --target "$GITHUB_SHA" --title "Бункер — Последний шлюз • Android $VERSION_CODE" --notes "Подписанное обновление Android. Откройте APK и подтвердите установку. Для обновления поверх старой версии нужны одинаковые подпись и package ID."
          gh release edit "android-$VERSION_CODE" --draft=false --latest
      - name: Remove private runner files
        if: always()
        run: |
          rm -f "$HOME/.android/bunker.keystore" "$HOME/.config/godot/editor_settings-4.5.tres" /tmp/release-export.log
