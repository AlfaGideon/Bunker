name: Unity Android prototype APK
# A push to this branch reruns activation and the isolated test build.
on:
  workflow_dispatch:
  push:
    branches: [arena/574beb82-bunker]
    paths:
      - 'unity/BunkerUnity/**'
      - 'unity/tools/**'
      - '.github/workflows/unity-android-build.yml'
permissions:
  contents: write
jobs:
  license-check:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          EMAIL: ${{ secrets.UNITY_USERNAME }}
          PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$EMAIL" ] && [ -n "$PASSWORD" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Unity Personal activation is missing. No Unity build was run; see docs/UNITY_BUILD.md.'
          fi
  android-prototype:
    needs: license-check
    if: needs.license-check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: unity-personal-activation
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Free runner space for Unity and Android modules
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /
      - name: Support current Unity Hub Linux path
        run: sudo ln -s /usr/lib/unityhub /opt/unityhub
      - name: Install Unity Editor and Android modules on the runner
        uses: buildalon/unity-setup@30fcbcb56c10ea5d64298e970d952b8d29bc268b # v2.6.0
        with:
          version-file: None
          unity-version: 2022.3.62f1
          build-targets: Android
          modules: android-sdk-ndk-tools, android-open-jdk
          cache-installation: true
      - name: Activate Unity Personal on the runner
        uses: buildalon/activate-unity-license@e0d245d0787b7b9931b56ccbde3b508f6b70f1af # v2.2.2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}
      - name: Verify touch camera and character imports in Unity
        run: |
          set +e
          "$UNITY_EDITOR_PATH" -batchmode -nographics -quit -logFile - \
            -projectPath "$GITHUB_WORKSPACE/unity/BunkerUnity" -buildTarget Android \
            -executeMethod Bunker.UnityPort.Editor.CharacterAssetAudit.VerifyAll 2>&1 | tee "$RUNNER_TEMP/unity-audit.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/unity-audit.log" <<'PYLOG'
          import re, sys
          lines=open(sys.argv[1], errors='replace').read().splitlines()
          useful=[line.strip() for line in lines if re.search(r'error CS\d+|Exception:|error|failed|unable to|not found|cannot be found|not valid|terminat|fatal',line,re.I) and not re.search(r'ALSA|FMOD|Licensing|player prefs', line, re.I)]
          for line in useful[-30:]:
              print('::error::'+line.replace('%','%25').replace('\r','%0D').replace('\n','%0A')[:1200])
          PYLOG
            exit "$code"
          fi
      - name: Render and inspect match world in Unity
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          set +e
          xvfb-run -a "$UNITY_EDITOR_PATH" -batchmode -force-glcore -quit -logFile - \
            -projectPath "$GITHUB_WORKSPACE/unity/BunkerUnity" -buildTarget Android \
            -executeMethod Bunker.UnityPort.Editor.WorldAudit.Render 2>&1 | tee "$RUNNER_TEMP/world-audit.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/world-audit.log" <<'PYLOG'
          import re, sys
          lines=open(sys.argv[1], errors='replace').read().splitlines()
          useful=[line.strip() for line in lines if re.search(r'error CS\d+|Exception:|failed|unable to|not found|fatal',line,re.I) and not re.search(r'ALSA|FMOD|Licensing|player prefs',line,re.I)]
          for line in useful[-25:]: print('::error::'+line.replace('%','%25').replace('\r','%0D').replace('\n','%0A')[:1200])
          PYLOG
            exit "$code"
          fi
          test -s unity/BunkerUnity/Builds/world-audit.jpg
      - name: Prepare three cutscene preview frames
        run: |
          for i in 0 1 2; do
            base64 -w0 "unity/BunkerUnity/Builds/camp-audit-$i.jpg" > "$RUNNER_TEMP/camp$i"
          done
          python3 - <<'PYIMAGE'
          import os
          data=[open(os.environ['RUNNER_TEMP']+'/camp'+str(i)).read() for i in range(3)]
          if sum((len(d)+3799)//3800 for d in data)>45: raise Exception('preview exceeds annotation budget')
          PYIMAGE
      - name: Capture cutscene preview part 1
        run: |
          python3 - <<'PYIMAGE'
          import os
          data=[]
          for j in range(3):
              s=open(os.environ['RUNNER_TEMP']+'/camp'+str(j)).read()
              data.extend((j,k//3800,s[k:k+3800]) for k in range(0,len(s),3800))
          for j,k,part in data[0:9]: print('::notice::FRAME%dPART%03d=' % (j,k) + part)
          PYIMAGE
      - name: Capture cutscene preview part 2
        run: |
          python3 - <<'PYIMAGE'
          import os
          data=[]
          for j in range(3):
              s=open(os.environ['RUNNER_TEMP']+'/camp'+str(j)).read()
              data.extend((j,k//3800,s[k:k+3800]) for k in range(0,len(s),3800))
          for j,k,part in data[9:18]: print('::notice::FRAME%dPART%03d=' % (j,k) + part)
          PYIMAGE
      - name: Capture cutscene preview part 3
        run: |
          python3 - <<'PYIMAGE'
          import os
          data=[]
          for j in range(3):
              s=open(os.environ['RUNNER_TEMP']+'/camp'+str(j)).read()
              data.extend((j,k//3800,s[k:k+3800]) for k in range(0,len(s),3800))
          for j,k,part in data[18:27]: print('::notice::FRAME%dPART%03d=' % (j,k) + part)
          PYIMAGE
      - name: Capture cutscene preview part 4
        run: |
          python3 - <<'PYIMAGE'
          import os
          data=[]
          for j in range(3):
              s=open(os.environ['RUNNER_TEMP']+'/camp'+str(j)).read()
              data.extend((j,k//3800,s[k:k+3800]) for k in range(0,len(s),3800))
          for j,k,part in data[27:36]: print('::notice::FRAME%dPART%03d=' % (j,k) + part)
          PYIMAGE
      - name: Capture cutscene preview part 5
        run: |
          python3 - <<'PYIMAGE'
          import os
          data=[]
          for j in range(3):
              s=open(os.environ['RUNNER_TEMP']+'/camp'+str(j)).read()
              data.extend((j,k//3800,s[k:k+3800]) for k in range(0,len(s),3800))
          for j,k,part in data[36:45]: print('::notice::FRAME%dPART%03d=' % (j,k) + part)
          PYIMAGE
      - name: Build separately installed prototype, not a production update
        run: |
          set +e
          "$UNITY_EDITOR_PATH" -batchmode -nographics -quit -logFile - \
            -projectPath "$GITHUB_WORKSPACE/unity/BunkerUnity" -buildTarget Android \
            -executeMethod Bunker.UnityPort.Editor.PrototypeBuild.BuildAndroid 2>&1 | tee "$RUNNER_TEMP/unity-build.log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] || [ ! -f unity/BunkerUnity/Builds/bunker-unity-prototype.apk ]; then
            python3 - "$RUNNER_TEMP/unity-build.log" <<'PYLOG'
          import re, sys
          lines = open(sys.argv[1], errors='replace').read().splitlines()
          useful = [line.strip() for line in lines if re.search(r'error CS\d+|Exception:|error|failed|unable to|not found|cannot be found|invalid dependencies|not valid|terminat|fatal', line, re.I)]
          for line in useful[-35:]:
              line = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error::' + line[:1200])
          PYLOG
            echo '::error::Unity build failed or did not produce the prototype APK.'
            exit 1
          fi
      - name: Validate APK integrity, package, signature and radio bridge
        run: bash unity/tools/verify_apk.sh unity/BunkerUnity/Builds/bunker-unity-prototype.apk
      - name: Save test APK
        uses: actions/upload-artifact@v4
        with:
          name: bunker-unity-prototype-android
          path: unity/BunkerUnity/Builds/bunker-unity-prototype.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct test APK (not production)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "unity-test-$GITHUB_RUN_ID" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Unity test $GITHUB_RUN_ID" \
            --notes "Тестовая Unity-сборка, не готовая игра. Отдельный package ID и тестовая подпись; не заменяет Godot." \
            "unity/BunkerUnity/Builds/bunker-unity-prototype.apk#Bunker-Unity-Test.apk"
