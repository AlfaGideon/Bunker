name: Inspect camp preview
on:
  push:
    branches: [arena/574beb82-bunker]
    paths: [.github/workflows/live-camp-preview.yml]
permissions:
  actions: read
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Read completed preview from running Unity job
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --allow-escape-sequences "repos/$GH_REPO/actions/jobs/124872894214/logs" > /tmp/log.txt
          python3 - <<'PY'
          import re
          s=open('/tmp/log.txt',errors='replace').read()
          parts=dict((int(i),v) for i,v in re.findall(r'CAMPPART(\d{3})=([A-Za-z0-9+/=]+)',s))
          assert parts and sorted(parts)==list(range(len(parts))), 'preview unavailable or incomplete'
          open('/tmp/camp64','w').write(''.join(parts[i] for i in sorted(parts)))
          PY
      - name: Preview segment 1
        run: |
          python3 - <<'PY'
          s=open('/tmp/camp64').read()
          for i in range(0,9):
              p=s[i*3800:(i+1)*3800]
              if p: print('::notice::CAMPPART%03d=' % i + p)
          PY
      - name: Preview segment 2
        run: |
          python3 - <<'PY'
          s=open('/tmp/camp64').read()
          for i in range(9,18):
              p=s[i*3800:(i+1)*3800]
              if p: print('::notice::CAMPPART%03d=' % i + p)
          PY
      - name: Preview segment 3
        run: |
          python3 - <<'PY'
          s=open('/tmp/camp64').read()
          for i in range(18,27):
              p=s[i*3800:(i+1)*3800]
              if p: print('::notice::CAMPPART%03d=' % i + p)
          PY
      - name: Preview segment 4
        run: |
          python3 - <<'PY'
          s=open('/tmp/camp64').read()
          for i in range(27,36):
              p=s[i*3800:(i+1)*3800]
              if p: print('::notice::CAMPPART%03d=' % i + p)
          PY
      - name: Preview segment 5
        run: |
          python3 - <<'PY'
          s=open('/tmp/camp64').read()
          for i in range(36,45):
              p=s[i*3800:(i+1)*3800]
              if p: print('::notice::CAMPPART%03d=' % i + p)
          PY
