name: Diagnose Unity audit
on:
  push:
    branches: [arena/574beb82-bunker]
    paths: [.github/workflows/diagnose-unity.yml]
permissions:
  actions: read
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --allow-escape-sequences "repos/$GH_REPO/actions/jobs/124854707273/logs" > /tmp/log.txt
          python3 - <<'PY'
          import re
          lines=open('/tmp/log.txt',errors='replace').read().splitlines()
          for i, line in enumerate(lines):
              if 'An error occurred while resolving packages' in line:
                  print('::notice::'+('%0A'.join(lines[i:i+12]).replace('%0A','___').replace('%','%25').replace('___','%0A'))[:3800])
          PY
