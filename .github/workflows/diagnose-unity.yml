name: Diagnose Unity audit
on:
  push:
    branches: [arena/574beb82-bunker]
    paths: [.github/workflows/diagnose-unity.yml]
permissions:
  actions: read
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --allow-escape-sequences "repos/$GH_REPO/actions/jobs/124858177153/logs" > /tmp/log.txt
          python3 - <<'PY'
          lines=open('/tmp/log.txt',errors='replace').read().splitlines()
          selected=[l for l in lines if any(s in l for s in ['CHARACTER_IMPORTER','Exception:', 'KHR_', 'BUNKER_TOUCH_AUDIT_OK','Failed to import Assets/Models/'])]
          for line in selected[-10:]:
              print('::notice::'+line.replace('%','%25').replace('\r','%0D')[:3800])
          PY
