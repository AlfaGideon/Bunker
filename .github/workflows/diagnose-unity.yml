name: Diagnose Unity audit
on:
  push:
    branches: [arena/574beb82-bunker]
    paths: [.github/workflows/diagnose-unity.yml]
permissions:
  actions: read
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --allow-escape-sequences "repos/$GH_REPO/actions/jobs/124856956244/logs" > /tmp/log.txt
          python3 - <<'PY'
          lines=open('/tmp/log.txt',errors='replace').read().splitlines()
          for i,line in enumerate(lines):
              if ('exception:' in line.lower() or 'Failed to import Assets/Models/' in line or 'BUNKER_TOUCH_AUDIT_OK' in line or 'gltf' in line.lower() and 'error' in line.lower()):
                  text='\n'.join(lines[max(0,i-1):i+4])
                  print('::notice::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')[:3800])
          PY
