name: Diagnose Unity audit
on:
  push:
    branches: [arena/574beb82-bunker]
    paths: [.github/workflows/diagnose-unity.yml]
permissions:
  actions: read
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --allow-escape-sequences "repos/$GH_REPO/actions/jobs/124855630271/logs" > /tmp/log.txt
          python3 - <<'PY'
          lines=open('/tmp/log.txt',errors='replace').read().splitlines()
          for i,line in enumerate(lines):
              if any(s in line.lower() for s in ['exception','fatal','error cs','not imported','was not','can not','failed','error occurred']):
                  if not any(s in line for s in ('ALSA', 'Licensing','FMOD', 'Unable to load player prefs')):
                      text='\n'.join(lines[max(0,i-2):i+5])
                      print('::notice::'+text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')[:3800])
          PY
